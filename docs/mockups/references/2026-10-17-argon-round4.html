<!doctype html>
<html lang="fr" data-theme="dark" data-font-scale="1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flourprint 0.3 UX — Prototype Comparatif (Round 4 Baseline)</title>
    <style>
      /* ==========================================================================
         1. DESIGN TOKENS (rem-based, Warm Bakery Palette, Light / Dark / AMOLED)
         ========================================================================== */
      :root,
      [data-theme='light'] {
        color-scheme: light;
        --bg-studio: #e6dfd3;
        --bg-canvas: #f8f4ec;
        --bg-surface: #ffffff;
        --bg-surface-hover: #fcfaf5;
        --bg-container: #f1eadf;
        --bg-elevated: #ffffff;
        --bg-featured: #fffaf2;
        --bg-overlay: rgba(28, 22, 18, 0.48);

        --text-main: #1f1814;
        --text-secondary: #4a3f37;
        --text-muted: #6b5e54;
        --text-on-primary: #ffffff;

        --primary: #9c4221;
        --primary-hover: #b34d28;
        --primary-soft: #fbe6d8;
        --primary-border: #e6b396;

        --secondary: #4a5568;
        --secondary-soft: #e6ecf2;

        --success: #226444;
        --success-soft: #def5e8;
        --warning: #a84d08;
        --warning-soft: #fef0c7;
        --danger: #9b2c2c;
        --danger-soft: #fde2e2;

        --border-subtle: #e4dacb;
        --border-strong: #c9bba6;
        --focus-ring: #9c4221;

        --shadow-xs: 0 0.0625rem 0.125rem rgba(28, 22, 18, 0.06);
        --shadow-sm: 0 0.125rem 0.375rem rgba(28, 22, 18, 0.08), 0 0.0625rem 0.125rem rgba(28, 22, 18, 0.05);
        --shadow-md: 0 0.375rem 1rem rgba(28, 22, 18, 0.12), 0 0.125rem 0.25rem rgba(28, 22, 18, 0.06);
        --shadow-lg: 0 0.75rem 2rem rgba(28, 22, 18, 0.18), 0 0.25rem 0.625rem rgba(28, 22, 18, 0.1);
        --shadow-featured: 0 0.25rem 0.875rem rgba(156, 66, 33, 0.14);

        --radius-xs: 0.375rem;
        --radius-sm: 0.5rem;
        --radius-md: 0.75rem;
        --radius-lg: 1rem;
        --radius-xl: 1.25rem;
        --radius-full: 9999px;

        --space-1: 0.25rem;
        --space-1-5: 0.375rem;
        --space-2: 0.5rem;
        --space-2-5: 0.625rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;

        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;

        --touch-target: 2.75rem;
        --transition-fast: 140ms cubic-bezier(0.2, 0, 0, 1);
        --transition-med: 220ms cubic-bezier(0.2, 0, 0, 1);
      }

      [data-theme='dark'] {
        color-scheme: dark;
        --bg-studio: #0c0a09;
        --bg-canvas: #151210;
        --bg-surface: #201b18;
        --bg-surface-hover: #28221e;
        --bg-container: #2b2420;
        --bg-elevated: #2e2622;
        --bg-featured: #291f1a;
        --bg-overlay: rgba(0, 0, 0, 0.68);

        --text-main: #f6f1e7;
        --text-secondary: #d8cfc3;
        --text-muted: #b0a395;
        --text-on-primary: #17120f;

        --primary: #f0925c;
        --primary-hover: #f5a678;
        --primary-soft: #3d2417;
        --primary-border: #7a4326;

        --secondary: #b2becd;
        --secondary-soft: #28313e;

        --success: #6ee7a0;
        --success-soft: #193b2a;
        --warning: #f8b864;
        --warning-soft: #3f2912;
        --danger: #fc8989;
        --danger-soft: #431c1c;

        --border-subtle: #332b26;
        --border-strong: #4e423a;
        --focus-ring: #f0925c;

        --shadow-xs: 0 0.0625rem 0.125rem rgba(0, 0, 0, 0.35);
        --shadow-sm: 0 0.125rem 0.375rem rgba(0, 0, 0, 0.45);
        --shadow-md: 0 0.375rem 1rem rgba(0, 0, 0, 0.55);
        --shadow-lg: 0 0.875rem 2.25rem rgba(0, 0, 0, 0.72);
        --shadow-featured: 0 0.25rem 1rem rgba(240, 146, 92, 0.16);
      }

      [data-theme='amoled'] {
        color-scheme: dark;
        --bg-studio: #000000;
        --bg-canvas: #000000;
        --bg-surface: #0b0908;
        --bg-surface-hover: #14110f;
        --bg-container: #151210;
        --bg-elevated: #181412;
        --bg-featured: #17100c;
        --bg-overlay: rgba(0, 0, 0, 0.82);

        --text-main: #ffffff;
        --text-secondary: #e2dad0;
        --text-muted: #b8aca0;
        --text-on-primary: #000000;

        --primary: #ff9d66;
        --primary-hover: #ffb085;
        --primary-soft: #2e180d;
        --primary-border: #874827;

        --secondary: #c4d0df;
        --secondary-soft: #1e2631;

        --success: #7ef2ad;
        --success-soft: #112e1f;
        --warning: #ffc270;
        --warning-soft: #33200a;
        --danger: #ff9494;
        --danger-soft: #361212;

        --border-subtle: #26201c;
        --border-strong: #453a33;
        --focus-ring: #ff9d66;

        --shadow-xs: 0 0 0 0.0625rem #26201c;
        --shadow-sm: 0 0.125rem 0.375rem rgba(0, 0, 0, 0.8);
        --shadow-md: 0 0.375rem 1rem rgba(0, 0, 0, 0.9);
        --shadow-lg: 0 0.875rem 2.25rem rgba(0, 0, 0, 0.95);
        --shadow-featured: 0 0 0 0.0625rem var(--primary-border);
      }

      html[data-font-scale='1'] {
        font-size: 100%;
      }
      html[data-font-scale='1.3'] {
        font-size: 130%;
      }
      html[data-font-scale='2'] {
        font-size: 200%;
      }

      /* ==========================================================================
         2. RESET & BASE TYPOGRAPHY (Fixes Dark-Mode Button Contrast Bug)
         ========================================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg-studio);
        color: var(--text-main);
        font-family: var(--font-sans);
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      /* Crucial fix: buttons, inputs and selects ALWAYS inherit --text-main */
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      /* Tabular numbers on body font instead of developer console monospace */
      .tabular {
        font-variant-numeric: tabular-nums;
      }

      .mono-code {
        font-family: var(--font-mono);
        font-size: 0.75rem;
      }

      /* ==========================================================================
         3. STUDIO HARNESS (Top Comparison Toolbar + Phone Frame)
         ========================================================================== */
      .studio-bar {
        position: sticky;
        top: 0;
        z-index: 200;
        background: #1a1614;
        color: #f5f0e6;
        border-bottom: 0.0625rem solid #362e29;
        padding: 0.5rem 0.875rem;
        font-size: 13px; /* Fixed px on studio harness so 130% scale only scales the phone */
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.625rem;
      }

      .studio-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.375rem;
      }

      .studio-label {
        color: #b0a395;
        font-weight: 600;
        margin-right: 0.25rem;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .studio-pill {
        background: #2b2420;
        color: #e6dfd5;
        border: 1px solid #453a33;
        border-radius: 6px;
        padding: 4px 9px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-fast);
      }

      .studio-pill:hover {
        background: #382f2a;
      }

      .studio-pill.active {
        background: #f0925c;
        color: #17120f;
        border-color: #f0925c;
      }

      .studio-stage {
        display: flex;
        justify-content: center;
        padding: 1.25rem 0.75rem 3rem;
      }

      .phone-viewport {
        width: 100%;
        max-width: 393px;
        background: var(--bg-canvas);
        color: var(--text-main);
        border: 0.0625rem solid var(--border-strong);
        border-radius: 1.75rem;
        box-shadow: var(--shadow-lg);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 780px;
      }

      .phone-viewport[data-vp='360'] {
        max-width: 360px;
      }
      .phone-viewport[data-vp='320'] {
        max-width: 320px;
      }
      .phone-viewport[data-vp='full'] {
        max-width: 46rem;
        border-radius: 1rem;
      }

      /* ==========================================================================
         4. APP SHELL, TOP BAR & ANCHORED POPOVER MENU
         ========================================================================== */
      .app-shell {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 780px;
        position: relative;
        padding-bottom: 4.75rem;
      }

      .top-bar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--bg-surface);
        border-bottom: 0.0625rem solid var(--border-subtle);
        padding: var(--space-2-5) var(--space-3);
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        box-shadow: var(--shadow-xs);
      }

      .top-bar-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        min-height: 2.5rem;
      }

      .top-bar-title-group {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        min-width: 0;
        flex: 1;
      }

      .top-bar-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text-main);
        overflow-wrap: anywhere;
      }

      .top-bar-actions {
        display: flex;
        align-items: center;
        gap: var(--space-1-5);
        flex-shrink: 0;
        position: relative;
      }

      /* Build identity chip (#131) */
      .build-chip {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1-5);
        padding: 0.1875rem 0.5rem;
        border-radius: var(--radius-full);
        background: var(--bg-container);
        border: 0.0625rem solid var(--border-subtle);
        color: var(--text-muted);
        font-size: 0.6875rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-fast);
      }

      .build-chip:hover {
        border-color: var(--primary);
        color: var(--text-main);
      }

      /* Screen Content & Stack */
      .screen {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .screen-content {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        padding: var(--space-3);
        width: 100%;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: var(--space-2-5);
      }

      .row {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }

      .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        flex-wrap: wrap;
      }

      .muted {
        color: var(--text-muted);
      }

      /* ==========================================================================
         5. SURFACES, BADGES & BUTTONS
         ========================================================================== */
      .surface {
        background: var(--bg-surface);
        color: var(--text-main);
        border: 0.0625rem solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: var(--space-3);
        box-shadow: var(--shadow-xs);
      }

      .surface-container {
        background: var(--bg-container);
      }

      .surface-elevated {
        background: var(--bg-elevated);
        box-shadow: var(--shadow-sm);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.3125rem;
        padding: 0.1875rem 0.5625rem;
        border-radius: var(--radius-full);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.25;
        white-space: nowrap;
        border: 0.0625rem solid transparent;
      }

      .badge-default {
        background: var(--bg-container);
        color: var(--text-secondary);
        border-color: var(--border-subtle);
      }

      .badge-primary {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: var(--primary-border);
      }

      .badge-success {
        background: var(--success-soft);
        color: var(--success);
      }

      .badge-warning {
        background: var(--warning-soft);
        color: var(--warning);
      }

      .badge-danger {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .pulse-dot {
        width: 0.4375rem;
        height: 0.4375rem;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-1-5);
        min-height: 2.375rem;
        padding: 0.4375rem 0.875rem;
        border-radius: var(--radius-md);
        border: 0.0625rem solid var(--border-strong);
        background: var(--bg-surface);
        color: var(--text-main);
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-fast);
      }

      .btn:hover:not(:disabled) {
        background: var(--bg-surface-hover);
        border-color: var(--primary);
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--text-on-primary);
        border-color: var(--primary);
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
      }

      .btn-soft {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: var(--primary-border);
      }

      .btn-danger {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: transparent;
      }

      .btn-sm {
        min-height: 2rem;
        padding: 0.25rem 0.625rem;
        font-size: 0.8125rem;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.375rem;
        height: 2.375rem;
        border-radius: var(--radius-md);
        border: 0.0625rem solid var(--border-subtle);
        background: var(--bg-surface);
        color: var(--text-main);
        cursor: pointer;
        transition: var(--transition-fast);
        flex-shrink: 0;
      }

      .icon-btn:hover {
        background: var(--bg-container);
        border-color: var(--border-strong);
      }

      .icon-btn-primary {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: var(--primary-border);
      }

      /* ==========================================================================
         6. SEGMENTED CONTROLS & FILTER CHIPS (Fixes ProcessView single button)
         ========================================================================== */
      .segmented {
        display: flex;
        background: var(--bg-container);
        padding: 0.1875rem;
        border-radius: var(--radius-md);
        border: 0.0625rem solid var(--border-subtle);
        gap: 0.125rem;
      }

      .segmented-btn {
        flex: 1;
        min-height: 2.125rem;
        padding: 0.25rem 0.625rem;
        border: none;
        border-radius: calc(var(--radius-md) - 0.125rem);
        background: transparent;
        color: var(--text-secondary);
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        transition: var(--transition-fast);
      }

      .segmented-btn[aria-selected='true'],
      .segmented-btn.active {
        background: var(--bg-surface);
        color: var(--text-main);
        box-shadow: var(--shadow-xs);
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1-5);
      }

      .filter-chip {
        padding: 0.3125rem 0.75rem;
        border-radius: var(--radius-full);
        border: 0.0625rem solid var(--border-subtle);
        background: var(--bg-surface);
        color: var(--text-secondary);
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-fast);
      }

      .filter-chip.active {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: var(--primary-border);
      }

      /* ==========================================================================
         7. LIBRARY CARDS (Fixes all 21 missing classes + elevation + icon pills)
         ========================================================================== */
      .recipe-card {
        width: 100%;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: var(--space-2-5);
        padding: var(--space-3);
        border-radius: var(--radius-lg);
        background: var(--bg-surface);
        color: var(--text-main);
        border: 0.0625rem solid var(--border-subtle);
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        transition: var(--transition-med);
      }

      .recipe-card:hover {
        transform: translateY(-0.0625rem);
        border-color: var(--border-strong);
        box-shadow: var(--shadow-md);
      }

      .recipe-card.featured {
        background: var(--bg-featured);
        border-color: var(--primary-border);
        box-shadow: var(--shadow-featured);
      }

      .recipe-card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--space-2);
      }

      .recipe-card-title {
        font-size: 1.0625rem;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1.3;
      }

      .recipe-card-subtitle {
        font-size: 0.8125rem;
        color: var(--text-muted);
        margin-top: 0.125rem;
      }

      .recipe-card-details {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-1-5);
      }

      .recipe-card-detail-item {
        display: inline-flex;
        align-items: center;
        gap: 0.3125rem;
        padding: 0.1875rem 0.5rem;
        border-radius: var(--radius-xs);
        background: var(--bg-container);
        color: var(--text-secondary);
        font-size: 0.75rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* ==========================================================================
         8. RECIPE SUMMARY CARD (#125 — Primary vs Secondary Metrics + Bottom Notice)
         ========================================================================== */
      .recipe-summary-box {
        display: flex;
        flex-direction: column;
        gap: var(--space-2-5);
        background: var(--bg-surface);
        border: 0.0625rem solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: var(--space-3);
        box-shadow: var(--shadow-sm);
      }

      .recipe-summary-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
      }

      .recipe-summary-heading {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        flex-wrap: wrap;
      }

      .recipe-summary-title {
        font-size: 0.8125rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-2);
      }

      @media (max-width: 350px) {
        .metric-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .metric-box {
        display: flex;
        flex-direction: column;
        gap: 0.1875rem;
        padding: var(--space-2-5);
        border-radius: var(--radius-md);
        background: var(--bg-container);
        border: 0.0625rem solid var(--border-subtle);
        text-align: left;
      }

      button.metric-box {
        cursor: pointer;
        transition: var(--transition-fast);
      }

      button.metric-box:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      .metric-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.25rem;
      }

      .metric-value {
        font-size: 1.1875rem;
        font-weight: 800;
        color: var(--text-main);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .metric-sub {
        font-size: 0.6875rem;
        color: var(--primary);
        font-weight: 600;
      }

      .secondary-metrics-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        padding-top: 0.125rem;
      }

      .secondary-metric-pill {
        flex: 1;
        min-width: 7.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        padding: 0.375rem 0.625rem;
        border-radius: var(--radius-sm);
        background: var(--bg-canvas);
        border: 0.0625rem solid var(--border-subtle);
        font-size: 0.75rem;
      }

      .recipe-summary-notice-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        padding: 0.5rem 0.625rem;
        border-radius: var(--radius-sm);
        background: var(--warning-soft);
        color: var(--warning);
        font-size: 0.75rem;
        font-weight: 600;
      }

      .recipe-summary-notice {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      /* ==========================================================================
         9. INGREDIENT ROWS & DISCLOSURE GROUPS (Fixes orphaned ingredient-* classes)
         ========================================================================== */
      .disclosure {
        background: var(--bg-surface);
        border: 0.0625rem solid var(--border-subtle);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-xs);
      }

      .disclosure-header {
        width: 100%;
        display: flex;
        align-items: center;

        font-weight: 600;

        font-weight: 600;

        background: transparent;

      .menu-item.danger {

      .menu-divider {

      .modal-backdrop {

            group: 'Pâte principale',
            title: 'Cuisson en moule Pullman',
            duration: '35 min',
            temp: '190 °C',
            steam: 'Buée légère',
            vessel: 'Moule Pullman 20 cm',
            start: '15:36',
            end: '16:11',
            cue: 'Température à cœur 94 °C, croûte dorée fine',
            instructions: 'Enfourner à 190 °C pendant 35 min. Démouler immédiatement sur grille à la sortie du four.',
          },
        ],

        bakeLogs: [
          { time: '12:05', text: 'Tangzhong cuit à 65 °C (96 g pesés).' },
          { time: '12:49', text: 'Fin du pétrissage : température de base mesurée à 24,4 °C.' },
        ],
      };

      /* ==========================================================================
         COMPUTED METRICS (@flourprint/core logic)
         ========================================================================== */
      function computeFormula() {
        const all = [...state.ingredients.tangzhong, ...state.ingredients.final];
        const totalFlour = all.filter((i) => i.isFlour).reduce((s, i) => s + i.mass, 0);
        const tzMass = state.ingredients.tangzhong.reduce((s, i) => s + i.mass, 0);
        const finalMixMass = state.ingredients.final.reduce((s, i) => s + i.mass, 0);
        const totalDough = Math.round((tzMass + finalMixMass) * 10) / 10;

        let knownWater = 0;
        const unknownItems = [];
        all.forEach((i) => {
          if (i.waterRatio === null) {
            unknownItems.push(i);
          } else if (i.waterRatio > 0) {
            knownWater += i.mass * i.waterRatio;
          }
        });

        const hydrationPct = totalFlour > 0 ? Math.round((knownWater / totalFlour) * 1000) / 10 : 0;
        const fatMass = all.filter((i) => i.isFat).reduce((s, i) => s + i.mass, 0);
        const sugarMass = all.filter((i) => i.isSugar).reduce((s, i) => s + i.mass, 0);

        return {
          totalFlour: Math.round(totalFlour * 10) / 10,
          tzMass: Math.round(tzMass * 10) / 10,
          finalMixMass: Math.round(finalMixMass * 10) / 10,
          totalDough,
          knownWater: Math.round(knownWater * 10) / 10,
          hydrationPct,
          fatMass,
          fatPct: Math.round((fatMass / totalFlour) * 1000) / 10,
          sugarMass,
          sugarPct: Math.round((sugarMass / totalFlour) * 1000) / 10,
          unknownItems,
        };
      }

        };
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || ''}</svg>`;
      }

      /* ==========================================================================
         ACTIONS & INTERACTIVITY
         ========================================================================== */
      function setNavOption(opt) {
        state.navOption = opt;
        state.menuOpen = false;
        document.getElementById('ctrl-nav-a').classList.toggle('active', opt === 'A');
        document.getElementById('ctrl-nav-b').classList.toggle('active', opt === 'B');
        render();
      }

      function setTheme(theme) {
        state.theme = theme;
        document.documentElement.setAttribute('data-theme', theme);
        ['light', 'dark', 'amoled'].forEach((t) => {
          document.getElementById('ctrl-theme-' + t).classList.toggle('active', t === theme);
        });
      }

      function setViewport(vp, scale) {
        document.getElementById('phone-vp').setAttribute('data-vp', vp);
        document.documentElement.setAttribute('data-font-scale', scale);
        ['393', '360', '320'].forEach((v) => {
          document.getElementById('ctrl-vp-' + v).classList.toggle('active', v === vp);
        });
      }

      function jumpScreen(target) {
        state.menuOpen = false;
        if (target === 'steps') {
          state.screen = 'recipe';
          state.recipeSubtab = 'steps';
        } else {
          state.screen = target;
          if (target === 'recipe') state.recipeSubtab = 'ingredients';
        }
        render();
      }

      function toggleWeighed(id) {
        if (state.recipeMode === 'edit') return;
        state.weighedIds[id] = !state.weighedIds[id];
        render();
      }

      function resetWeighed() {
        state.weighedIds = {};
        render();
      }

      function toggleGroup(key) {
        state.openGroups[key] = !state.openGroups[key];
        render();
      }

      function enterEditMode() {
        state.historyStack = [JSON.stringify(state.ingredients)];
        state.redoStack = [];
        state.recipeMode = 'edit';
        state.menuOpen = false;
        render();
      }

      function cancelEditMode() {
        if (state.historyStack.length > 0) {
          state.ingredients = JSON.parse(state.historyStack[0]);
        }
        state.recipeMode = 'consult';
        render();
      }

      function saveEditMode() {
        const f = computeFormula();
        state.recipes[0].mass = f.totalDough;
        state.recipes[0].hydration = Math.round(f.hydrationPct) + ' %';
        state.recipeMode = 'consult';
        render();
      }

      function updateIngredientMass(group, id, newValue) {
        const val = parseFloat(newValue);
        if (isNaN(val) || val < 0) return;
        state.historyStack.push(JSON.stringify(state.ingredients));
        const item = state.ingredients[group].find((i) => i.id === id);
        if (item) item.mass = Math.round(val * 10) / 10;
        render();
      }

      function moveStep(idx, dir) {
        const target = idx + dir;
        if (target < 0 || target >= state.steps.length) return;
        const copy = [...state.steps];
        const [item] = copy.splice(idx, 1);
        copy.splice(target, 0, item);
        state.steps = copy;
        render();
      }

      function createFromTemplate(name, mass, hydration) {
        state.recipes.unshift({
          id: 'new-' + Date.now(),
          title: name, // Clean name without suffix "1" (#128)
          subtitle: 'Créée depuis le modèle de base',
          status: 'Jamais cuite',
          statusVariant: 'default',
          category: 'unbaked',
          featured: false,
          mass,
          duration: '4 h 30',
          hydration,
          version: 'v1.0',
        });
        state.modal = null;
        state.screen = 'library';
        render();
      }

      function duplicateCurrentRecipe() {
        state.recipes.splice(1, 0, {
          ...state.recipes[0],
          id: 'copy-' + Date.now(),
          title: 'Shokupan au tangzhong (Copie)',
          status: 'Brouillon',
          statusVariant: 'default',
          featured: false,
        });
        state.menuOpen = false;
        state.screen = 'library';
        render();
      }

      function copyBuildInfo() {
        state.copiedBuild = true;
        render();
        setTimeout(() => {
          state.copiedBuild = false;
          render();
        }, 1800);
      }

      /* ==========================================================================
         SCREEN RENDERERS
         ========================================================================== */
      function renderTopBar() {
        const isLib = state.screen === 'library';
        const isOptB = state.navOption === 'B';

        let title = 'Bibliothèque';
        if (!isLib) title = 'Shokupan au tangzhong';

        // Option B places contextual actions in the Top AppBar (#112)
        let rightActions = '';
        if (isLib) {
          rightActions = `
            <button class="build-chip mono-code" onclick="copyBuildInfo()" title="Copier l'identité de build (#131)">
              ${icon('copy', 12)} ${state.copiedBuild ? 'Copié !' : '0.3.0+7c7c2e7'}
            </button>
            ${
              isOptB
                ? `<button class="btn btn-primary btn-sm" onclick="state.modal='newRecipe';render()">${icon('plus', 15)} Nouvelle</button>`
                : ''
            }
          `;
        } else {
          rightActions = isOptB
            ? `
              ${
                state.recipeMode === 'consult'
                  ? `<button class="icon-btn" onclick="enterEditMode()" title="Modifier">${icon('edit', 17)}</button>
                     <button class="icon-btn icon-btn-primary" onclick="state.screen='prep';render()" title="Lancer la préparation">${icon('play', 17)}</button>`
                  : `<button class="btn btn-sm" onclick="cancelEditMode()">Annuler</button>
                     <button class="btn btn-primary btn-sm" onclick="saveEditMode()">Enregistrer</button>`
              }
              <button class="icon-btn" onclick="state.menuOpen=!state.menuOpen;render()" aria-label="Plus d'actions">${icon('more', 18)}</button>
            `
            : `
              <span class="badge badge-warning"><span class="pulse-dot"></span> Fournée active</span>
            `;
        }

        // Sub-navigation in Option A when inside a recipe
        const optionATabs =
          !isLib && state.navOption === 'A'
            ? `
          <div class="segmented" role="tablist" aria-label="Sections de la recette">
            <button class="segmented-btn ${state.screen === 'recipe' ? 'active' : ''}" onclick="state.screen='recipe';render()">Recette</button>
            <button class="segmented-btn ${state.screen === 'plan' ? 'active' : ''}" onclick="state.screen='plan';render()">Planification</button>
            <button class="segmented-btn ${state.screen === 'prep' ? 'active' : ''}" onclick="state.screen='prep';render()">Préparation</button>
            <button class="segmented-btn ${state.screen === 'history' ? 'active' : ''}" onclick="state.screen='history';render()">Historique</button>
          </div>
        `
            : '';

        return `
          <header class="top-bar">
            <div class="top-bar-main">
              <div class="top-bar-title-group">
                ${
                  !isLib
                    ? `<button class="icon-btn" onclick="state.screen='library';state.menuOpen=false;render()" aria-label="Retour à la bibliothèque">${icon('back', 18)}</button>`
                    : ''
                }
                <h1 class="top-bar-title">${title}</h1>
              </div>
              <div class="top-bar-actions">
                ${rightActions}
              </div>
            </div>
            ${optionATabs}
          </header>
        `;
      }

      function renderLibraryScreen() {
        const filtered = state.recipes.filter((r) => {
          const matchesQuery =
            !state.searchQuery ||

              </div>
            </div>

            <!-- Recipe Cards with Restored Round 2 Hierarchy & Icon Pills (#127) -->
            <div class="stack">
              ${filtered
                .map(
                  (r) => `
                <button type="button" class="recipe-card ${r.featured ? 'featured' : ''}" onclick="state.screen='recipe';render()">
                  <div class="recipe-card-header">

                      <div class="recipe-card-title">${r.title}</div>

      function renderRecipeScreen() {
        const f = computeFormula();
        const allItems = [...state.ingredients.tangzhong, ...state.ingredients.final];
        const weighedCount = allItems.filter((i) => state.weighedIds[i.id]).length;

        return `
          <div class="screen-content">

            <div class="segmented" role="tablist">
              <button class="segmented-btn ${state.recipeSubtab === 'ingredients' ? 'active' : ''}" onclick="state.recipeSubtab='ingredients';render()">
                Ingrédients (${allItems.length})
              </button>
              <button class="segmented-btn ${state.recipeSubtab === 'steps' ? 'active' : ''}" onclick="state.recipeSubtab='steps';render()">
                Étapes & Timeline (${state.steps.length})
              </button>
            </div>

            ${state.recipeSubtab === 'ingredients' ? renderIngredientsTab(f, weighedCount, allItems.length) : renderStepsTab()}
          </div>

      }

              </div>
              <div class="secondary-metric-pill">

                : ''

          <!-- STAGE 2: Pâte finale (Includes localized Tangzhong incorporation row) -->

              <div class="disclosure-headings">

              state.openGroups.final
                ? `
              <div class="disclosure-body">
                <div class="ingredient-row is-incorporation" style="cursor:default">
                  <div class="ingredient-row-main">
                    <span class="badge badge-primary">Incorporer</span>
                    <div class="ingredient-info">
                      <span class="ingredient-name">Tangzhong (préparation complète)</span>
                      <div class="ingredient-meta">
                        <span class="ingredient-pct">${Math.round((f.tzMass / f.totalFlour) * 1000) / 10} % boulanger</span>
                      </div>
                    </div>

                  <div class="ingredient-row-end">
                    <span class="ingredient-mass">${f.tzMass} g</span>

                </div>
                ${state.ingredients.final.map((row) => renderIngredientRow('final', row, f.totalFlour)).join('')}

          <!-- Collapsed Assembled Formula Totals (#125) -->

              </div>
            </div>
            <div class="ingredient-row-end" onclick="event.stopPropagation()">
              ${
                state.recipeMode === 'edit'
                  ? `
                <div class="inline-edit-group">
                  <label class="compact-input-wrap" aria-label="${row.name} en grammes">
                    <input
                      type="number"
                      step="1"
                      class="compact-input"
                      value="${row.mass}"
                      onchange="updateIngredientMass('${group}', '${row.id}', this.value)"
                    />
                    <span class="compact-unit">g</span>
                  </label>
                </div>
              `
                  : `<span class="ingredient-mass">${row.mass} g</span>`
              }
            </div>
          </div>
        `;
      }

      function renderStepsTab() {
        return `
          <!-- True 2-Option Segmented Switcher + Accessible Reorder Submode (#100, #123) -->
          <div class="row-between">
            <div class="segmented" role="tablist" aria-label="Mode d'affichage des étapes" style="flex:1">
              <button class="segmented-btn ${state.processView === 'grouped' ? 'active' : ''}" onclick="state.processView='grouped';render()">
                ${icon('list', 14)} Étapes groupées
              </button>
              <button class="segmented-btn ${state.processView === 'timeline' ? 'active' : ''}" onclick="state.processView='timeline';render()">
                ${icon('clock', 14)} Ligne de temps
              </button>
            </div>
            <button class="btn btn-sm ${state.reorderMode ? 'btn-soft' : ''}" onclick="state.reorderMode=!state.reorderMode;render()">
              ${state.reorderMode ? 'Terminer l’ordre' : 'Réordonner'}
            </button>
          </div>

          <!-- Fermentation Model Domain Validity Banner (#126) -->
          <div class="status-panel ${state.fermentationValid ? 'success' : 'warning'}">
            <div class="row-between">
              <strong style="font-size:0.8125rem;">
                ${
                  state.fermentationValid
                    ? '✓ Modèle de fermentation valide (domaine 4–32 °C)'
                    : '⚠ Température hors domaine du modèle (38 °C > 32 °C)'
                }
              </strong>
              <button class="btn btn-sm" style="min-height:1.625rem;padding:0.125rem 0.5rem;font-size:0.75rem;" onclick="state.fermentationValid=!state.fermentationValid;render()">
                Simuler ${state.fermentationValid ? 'Hors domaine' : 'Valide'}
              </button>
            </div>
            <div class="status-panel-message">
              ${
                state.fermentationValid
                  ? 'Projection Q10 active : Pointage estimé à 1 h 05 à 25 °C (candidat inverse : 24,5 °C pour 1 h 10).'
                  : 'L’estimation automatique est désactivée au-dessus de 32 °C (risque d’inactivation enzymatique). La durée manuelle (1 h 05) est conservée.'
              }
            </div>
          </div>

          ${
            state.processView === 'grouped'
              ? ['Tangzhong', 'Pâte principale']
                  .map(
                    (grp) => `
              <section class="disclosure" data-open="true">
                <div class="disclosure-header" style="cursor:default">
                  <div class="disclosure-headings">
                    <span class="disclosure-title">${grp}</span>
                    <span class="disclosure-subtitle">${state.steps.filter((s) => s.group === grp).length} étapes</span>
                  </div>
                </div>
                <div class="disclosure-body">
                  ${state.steps
                    .map((step, idx) => ({ step, idx }))
                    .filter((x) => x.step.group === grp)
                    .map(
                      ({ step, idx }) => `
                    <div class="step-row ${idx === state.activePrepStep ? 'is-active' : ''}">
                      <div class="step-row-main">
                        <span class="step-index">${idx + 1}</span>
                        <div class="step-row-body">
                          <div class="step-title-row">
                            <span class="step-title">${step.title}</span>
                          </div>
                          <div class="step-details">
                            <span class="step-detail-item">${icon('clock', 12)} ${step.duration}</span>
                            <span class="step-detail-item">${icon('flame', 12)} ${step.temp}</span>
                            ${step.steam ? `<span class="step-detail-item">${icon('droplet', 12)} ${step.steam}</span>` : ''}
                            ${step.vessel ? `<span class="step-detail-item">${step.vessel}</span>` : ''}
                          </div>
                          ${step.cue ? `<div class="muted" style="font-size:0.75rem;margin-top:0.125rem;">Repère : ${step.cue}</div>` : ''}
                        </div>
                      </div>
                      ${
                        state.reorderMode
                          ? `
                        <div class="row" style="gap:0.25rem;">
                          <button class="icon-btn" style="width:2rem;height:2rem;" onclick="moveStep(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} aria-label="Monter l'étape">${icon('up', 14)}</button>
                          <button class="icon-btn" style="width:2rem;height:2rem;" onclick="moveStep(${idx}, 1)" ${idx === state.steps.length - 1 ? 'disabled' : ''} aria-label="Descendre l'étape">${icon('down', 14)}</button>
                        </div>
                      `
                          : ''
                      }
                    </div>
                  `
                    )
                    .join('')}
                </div>
              </section>
            `
                  )
                  .join('')
              : `
              <!-- Visual Lane Timeline View -->
              <div class="timeline-track">
                ${state.steps
                  .map(
                    (step, idx) => `
                  <div class="timeline-node">
                    <div class="row-between">
                      <span class="badge ${step.group === 'Tangzhong' ? 'badge-default' : 'badge-primary'}">${step.group}</span>
                      <span class="tabular muted" style="font-size:0.75rem;font-weight:700;">${step.start} → ${step.end} (${step.duration})</span>
                    </div>
                    <div style="font-weight:700;margin-top:0.25rem;">${idx + 1}. ${step.title}</div>
                    <div class="step-details" style="margin-top:0.375rem;">
                      <span class="step-detail-item">${icon('flame', 12)} ${step.temp}</span>
                      ${step.steam ? `<span class="step-detail-item">${step.steam}</span>` : ''}
                      ${step.vessel ? `<span class="step-detail-item">${step.vessel}</span>` : ''}
                    </div>
                  </div>
                `
                  )
                  .join('')}
              </div>
            `
          }
        `;
      }

      function renderPlanScreen() {
        return `
          <div class="screen-content">
            <section class="surface stack">
              <div class="recipe-summary-title">Cible de planification</div>
              <div class="segmented">
                <button class="segmented-btn active">Début à 12:00</button>
                <button class="segmented-btn">Enfourner à 15:36</button>
                <button class="segmented-btn">Prêt à 17:11</button>
              </div>
              <div class="metric-grid" style="margin-top:0.25rem;">
                <div class="metric-box">
                  <span class="metric-label">Début Tangzhong</span>
                  <span class="metric-value">12:00</span>
                  <span class="metric-sub">Aujourd’hui</span>
                </div>
                <div class="metric-box">
                  <span class="metric-label">Enfournement</span>
                  <span class="metric-value">15:36</span>
                  <span class="metric-sub">Préchauffer 15:06</span>
                </div>
                <div class="metric-box">
                  <span class="metric-label">Fin ressuage</span>
                  <span class="metric-value">17:11</span>
                  <span class="metric-sub">Durée 5 h 11</span>
                </div>
              </div>
            </section>
            ${renderStepsTab()}
          </div>
        `;
      }

      function renderPrepScreen() {
        const step = state.steps[state.activePrepStep];
        return `
          <div class="screen-content">
            <!-- Step Selector Pill Row (Allows inspecting Step 4 Pointage vs Step 9 Cuisson #124) -->
            <div class="row-between">
              <span class="badge badge-warning">Étape ${state.activePrepStep + 1} sur ${state.steps.length} · ${step.group}</span>
              <div class="row" style="gap:0.25rem;">
                <button class="btn btn-sm" onclick="state.activePrepStep=3;state.timerMinutes=65;render()">Voir Étape 4 (Pointage)</button>
                <button class="btn btn-sm" onclick="state.activePrepStep=8;state.timerMinutes=35;render()">Voir Étape 9 (Cuisson)</button>
              </div>
            </div>

            <!-- ACTIVE STEP HERO CARD (#124: Timer + Instructions + Oven/Steam/Vessel BEFORE action buttons) -->
            <section class="prep-hero-card">
              <div>
                <div class="preparation-timer-title">Étape active (${step.start} → ${step.end})</div>
                <h2 style="margin:0.25rem 0 0;font-size:1.25rem;">${step.title}</h2>
              </div>

              <div class="row-between">
                <div class="prep-timer-display">${state.timerMinutes} min</div>
                <div class="step-details">
                  <span class="step-detail-item">${icon('flame', 13)} Cible ${step.temp}</span>
                  ${step.steam ? `<span class="step-detail-item">${icon('droplet', 13)} ${step.steam}</span>` : ''}
                </div>
              </div>

              <!-- Oven / Steam / Vessel Callout when on Baking step (#124) -->
              ${
                step.vessel || step.steam
                  ? `
                <div class="oven-grid">
                  <div class="metric-box">
                    <span class="metric-label">Four</span>
                    <span class="metric-value" style="font-size:1rem;">${step.temp}</span>
                    <span class="metric-sub">Statique</span>
                  </div>
                  <div class="metric-box">
                    <span class="metric-label">Buée</span>
                    <span class="metric-value" style="font-size:0.9375rem;">${step.steam || 'Sans'}</span>
                    <span class="metric-sub">Coup initial</span>
                  </div>
                  <div class="metric-box">
                    <span class="metric-label">Récipient</span>
                    <span class="metric-value" style="font-size:0.875rem;">Pullman</span>
                    <span class="metric-sub">20 cm fermé</span>
                  </div>
                </div>
              `
                  : ''
              }

              <!-- Instructions integrated directly inside the active card (NOT buried below 6 buttons!) -->
              <div class="prep-instruction-box">
                <div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);">
                  Consigne de l’étape
                </div>
                <div style="font-size:0.9375rem;font-weight:500;">${step.instructions}</div>
                ${
                  step.cue
                    ? `<div class="badge badge-primary" style="align-self:flex-start;white-space:normal;">Repère visuel : ${step.cue}</div>`
                    : ''
                }
              </div>

              <!-- Quick Action Controls Below Instructions -->
              <div class="row" style="flex-wrap:wrap;">
                <button class="btn btn-sm" onclick="state.timerMinutes+=15;state.bakeLogs.unshift({time:'Maintenant',text:'+15 min ajoutées à « '+step.title+' »'});render()">+15 min</button>
                <button class="btn btn-sm" onclick="state.bakeLogs.unshift({time:'Maintenant',text:'Observation notée : Pâte souple, dôme régulier'});render()">+ Observation</button>
                <button class="btn btn-primary" style="flex:1;" onclick="state.activePrepStep=(state.activePrepStep+1)%state.steps.length;render()">
                  ${icon('check', 16)} Étape terminée
                </button>
              </div>
            </section>

            <!-- Bake Log -->
            <section class="surface stack">
              <div class="recipe-summary-title">Journal de la fournée en cours</div>
              ${state.bakeLogs
                .map(
                  (l) => `
                <div class="row" style="font-size:0.8125rem;border-bottom:0.0625rem solid var(--border-subtle);padding-bottom:0.375rem;">
                  <span class="badge badge-default tabular">${l.time}</span>
                  <span>${l.text}</span>
                </div>
              `
                )
                .join('')}
            </section>
          </div>
        `;
      }

      function renderHistoryScreen() {
        return `
          <div class="screen-content">
            <section class="surface stack">
              <div class="row-between">
                <strong>Fournée #12 · 12 oct. 2026</strong>
                <span class="badge badge-success">★ 4,8 / 5</span>
              </div>
              <p class="muted" style="margin:0;font-size:0.875rem;">
                Mie filante très régulière, cuisson en moule Pullman fermé 34 min à 190 °C.
              </p>
            </section>
          </div>
        `;
      }

      /* ==========================================================================
         BOTTOM BAR: OPTION A vs OPTION B (#111, #112, #120 — Zero Giant Persistent CTA)
         ========================================================================== */
      function renderBottomBar() {
        if (state.navOption === 'A') {
          // Option A: Browser-like contextual action toolbar
          if (state.screen === 'library') {
            return `
              <nav class="bottom-bar" aria-label="Barre d'actions Option A (Bibliothèque)">
                <div class="option-a-toolbar">
                  <button class="toolbar-action" onclick="document.querySelector('input[type=search]')?.focus()">
                    ${icon('search', 17)}
                    <span>Rechercher</span>
                  </button>
                  <button class="toolbar-action is-primary" onclick="state.modal='newRecipe';render()">
                    ${icon('plus', 17)}
                    <span>Nouvelle recette</span>
                  </button>
                  <button class="toolbar-action" onclick="state.menuOpen=!state.menuOpen;render()">
                    ${icon('more', 17)}
                    <span>Menu</span>
                  </button>
                </div>
              </nav>
            `;
          }

          if (state.recipeMode === 'edit') {
            return `
              <nav class="bottom-bar" aria-label="Barre d'édition Option A">
                <div class="option-a-toolbar">
                  <button class="toolbar-action" onclick="cancelEditMode()">Annuler</button>
                  <button class="toolbar-action is-primary" onclick="saveEditMode()">
                    ${icon('check', 17)}
                    <span>Enregistrer</span>
                  </button>
                </div>
              </nav>
            `;
          }

          return `
            <nav class="bottom-bar" aria-label="Barre d'actions contextuelle Option A">
              <div class="option-a-toolbar">
                <button class="toolbar-action" onclick="enterEditMode()">
                  ${icon('edit', 17)}
                  <span>Modifier</span>
                </button>
                <button class="toolbar-action" onclick="state.screen='plan';render()">
                  ${icon('calendar', 17)}
                  <span>Planifier</span>
                </button>
                <button class="toolbar-action is-primary" onclick="state.screen='prep';render()">
                  ${icon('play', 17)}
                  <span>Lancer</span>
                </button>
                <button class="toolbar-action" onclick="state.menuOpen=!state.menuOpen;render()">
                  ${icon('more', 17)}
                  <span>Plus</span>
                </button>
              </div>
            </nav>
          `;
        }

        // Option B: 4-tab Material bottom navigation bar
        return `
          <nav class="bottom-bar" aria-label="Navigation principale Option B">
            <div class="option-b-tabs">
              <button class="nav-tab ${state.screen === 'library' ? 'active' : ''}" onclick="state.screen='library';render()">
                ${icon('book', 18)}
                <span>Bibliothèque</span>
              </button>
              <button class="nav-tab ${state.screen === 'recipe' ? 'active' : ''}" onclick="state.screen='recipe';render()">
                ${icon('list', 18)}
                <span>Recette</span>
              </button>
              <button class="nav-tab ${state.screen === 'plan' ? 'active' : ''}" onclick="state.screen='plan';render()">
                ${icon('calendar', 18)}
                <span>Planification</span>
              </button>
              <button class="nav-tab ${state.screen === 'prep' ? 'active' : ''}" onclick="state.screen='prep';render()">
                ${icon('flame', 18)}
                <span>Préparation</span>
              </button>
            </div>
          </nav>
        `;
      }

      /* ==========================================================================
         ANCHORED POPOVER MENU (`⋯`) & MODALS
         ========================================================================== */
      function renderAnchoredMenu() {
        if (!state.menuOpen) return '';
        const posClass = state.navOption === 'A' ? 'from-bottom' : 'from-top';
        return `
          <div class="anchored-menu ${posClass}" role="menu" aria-label="Actions de la recette">
            <button class="menu-item" onclick="enterEditMode()">
              <span>Modifier la recette</span>
              ${icon('edit', 15)}
            </button>
            <button class="menu-item" onclick="duplicateCurrentRecipe()">
              <span>Dupliquer la recette</span>
              ${icon('copy', 15)}
            </button>
            <button class="menu-item" onclick="state.recipeSubtab='steps';state.reorderMode=!state.reorderMode;state.menuOpen=false;render()">
              <span>Réordonner les étapes</span>
              ${icon('list', 15)}
            </button>
            <button class="menu-item" onclick="state.screen='history';state.menuOpen=false;render()">
              <span>Historique des fournées</span>
              ${icon('clock', 15)}
            </button>
            <div class="menu-divider"></div>
            <button class="menu-item danger" onclick="state.menuOpen=false;state.modal='deleteConfirm';render()">
              <span>Supprimer la recette</span>
            </button>
            <div class="menu-divider"></div>
            <div class="row-between" style="padding:0.25rem 0.5rem;font-size:0.6875rem;color:var(--text-muted);">
              <span class="mono-code">Flourprint 0.3.0+7c7c2e7</span>
              <span>Local-first</span>
            </div>
          </div>
        `;
      }

      function renderModal() {
        if (!state.modal) return '';
        const f = computeFormula();

        if (state.modal === 'hydration') {
          // Cleaned of the wrong copy-pasted helpSize text (#134 finding)
          return `
            <div class="modal-backdrop" onclick="state.modal=null;render()">
              <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="Détail de l'hydratation" onclick="event.stopPropagation()">
                <div class="modal-header">
                  <h3 style="margin:0;font-size:1.0625rem;">Détail de l’hydratation (Part connue)</h3>
                  <button class="btn btn-sm" onclick="state.modal=null;render()">Fermer</button>
                </div>
                <div class="modal-body">
                  <p class="muted" style="margin:0;">
                    L’hydratation additionne l’eau libre et la part d’eau connue des ingrédients composés (lait, beurre), rapportée à la farine totale (${f.totalFlour} g).
                  </p>
                  <div class="metric-grid">
                    <div class="metric-box">
                      <span class="metric-label">Eau connue</span>
                      <span class="metric-value">${f.knownWater} g</span>
                    </div>
                    <div class="metric-box">
                      <span class="metric-label">Farine totale</span>
                      <span class="metric-value">${f.totalFlour} g</span>
                    </div>
                    <div class="metric-box">
                      <span class="metric-label">Hydratation</span>
                      <span class="metric-value">${f.hydrationPct} %</span>
                    </div>
                  </div>
                  <div class="surface stack" style="padding:0.625rem;">
                    <div class="row-between"><span>Eau (Tangzhong)</span><strong class="tabular">80,0 g</strong></div>
                    <div class="row-between"><span>Eau (Pâte finale)</span><strong class="tabular">110,0 g</strong></div>
                    <div class="row-between"><span>Lait entier (45 g × 87,5 %)</span><strong class="tabular">39,4 g</strong></div>
                    <div class="row-between"><span>Beurre doux (31 g × 16 %)</span><strong class="tabular">5,0 g</strong></div>
                  </div>
                  <div class="recipe-summary-notice-wrap">
                    <span>Non comptabilisé (composition inconnue) : Poudre de lait écrémé (9 g)</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        if (state.modal === 'newRecipe') {
          return `
            <div class="modal-backdrop" onclick="state.modal=null;render()">
              <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="Nouvelle recette" onclick="event.stopPropagation()">
                <div class="modal-header">
                  <h3 style="margin:0;font-size:1.0625rem;">Choisir un modèle (#128)</h3>
                  <button class="btn btn-sm" onclick="state.modal=null;render()">Fermer</button>
                </div>
                <div class="modal-body">
                  <button class="recipe-card" onclick="createFromTemplate('Shokupan', 699, '73 %')">
                    <div class="recipe-card-header">
                      <span class="recipe-card-title">Shokupan (Tangzhong)</span>
                      <span class="badge badge-primary">699 g · 73 %</span>
                    </div>
                    <div class="recipe-card-subtitle">Crée « Shokupan » sans suffixe « 1 » superflu</div>
                  </button>
                  <button class="recipe-card" onclick="createFromTemplate('Pain au levain', 900, '75 %')">
                    <div class="recipe-card-header">
                      <span class="recipe-card-title">Pain au levain naturel</span>
                      <span class="badge badge-default">900 g · 75 %</span>
                    </div>
                    <div class="recipe-card-subtitle">Fermentation mixte sur levain liquide</div>
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        if (state.modal === 'deleteConfirm') {
          return `
            <div class="modal-backdrop" onclick="state.modal=null;render()">
              <div class="modal-sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
                <div class="modal-header">
                  <h3 style="margin:0;font-size:1.0625rem;">Supprimer « Shokupan au tangzhong » ?</h3>
                </div>
                <div class="modal-body">
                  <p class="muted" style="margin:0;">Cette action retirera la recette de la bibliothèque en mémoire.</p>
                  <div class="row" style="justify-content:flex-end;">
                    <button class="btn" onclick="state.modal=null;render()">Annuler</button>
                    <button class="btn btn-danger" onclick="state.recipes.shift();state.modal=null;state.screen='library';render()">Supprimer</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
        return '';
      }

      function render() {
        const root = document.getElementById('app-root');
        let bodyHtml = '';
        if (state.screen === 'library') bodyHtml = renderLibraryScreen();
        else if (state.screen === 'recipe') bodyHtml = renderRecipeScreen();
        else if (state.screen === 'plan') bodyHtml = renderPlanScreen();
        else if (state.screen === 'prep') bodyHtml = renderPrepScreen();
        else if (state.screen === 'history') bodyHtml = renderHistoryScreen();

        root.innerHTML = `
          ${renderTopBar()}
          <div class="screen">${bodyHtml}</div>
          ${renderAnchoredMenu()}
          ${renderBottomBar()}
          ${renderModal()}
        `;
      }

      render();
    </script>
  </body>
</html>
