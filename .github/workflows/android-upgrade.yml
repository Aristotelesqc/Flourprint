name: Android upgrade

# Upgrade from 0.1.0 on an emulator (issue #24, audit finding F43-1): the 0.1.0 APK gets real data
# through its own interface, then the candidate built from this commit installs over it.
#
# The start APK is a durable debug fixture rebuilt from the v0.1.0 tag (#319).
# See docs/device-testing.md for provenance and how the fixture was built.
on:
  pull_request:
    paths:
      - apps/mobile/android-upgrade-e2e/**
      - apps/mobile/playwright.android-upgrade.config.ts
      - .github/workflows/android-upgrade.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  BASELINE_RELEASE: android-upgrade-v0.1.0
  BASELINE_APK: flourprint-0.1.0-upgrade-baseline.apk
  BASELINE_SOURCE_SHA: 240450fcb41c3df484101aef841bfe8b93a59993
  BASELINE_APK_SHA256: 9e6567637db8134a00fb2a5a4d6db702d490c93824a49151942612ba8242953d

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge counter counts the history (ADR 0016)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      - name: Download and verify the 0.1.0 baseline APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin refs/tags/v0.1.0:refs/tags/v0.1.0 \
            "refs/tags/${BASELINE_RELEASE}:refs/tags/${BASELINE_RELEASE}"
          test "$(git rev-parse 'v0.1.0^{commit}')" = "$BASELINE_SOURCE_SHA"
          TAG_TREE=$(git rev-parse 'v0.1.0^{tree}')
          test "$(git rev-parse "${BASELINE_RELEASE}^{tree}")" = "$TAG_TREE"
          echo "Baseline ${BASELINE_RELEASE} matches v0.1.0 at ${BASELINE_SOURCE_SHA}, tree ${TAG_TREE}"
          gh release download "$BASELINE_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASELINE_APK" --dir "$RUNNER_TEMP"
          APK="${RUNNER_TEMP}/${BASELINE_APK}"
          printf '%s  %s\n' "$BASELINE_APK_SHA256" "$APK" | sha256sum --check
          echo "FLOURPRINT_APK_FROM=${APK}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Build names (ADR 0016)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/build-id.mjs
      - run: pnpm build
      - run: pnpm build:mobile
      - run: pnpm --filter @flourprint/mobile exec cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - name: Record both APKs (package, versionCode, minSdk, signer)
        run: |
          echo "FLOURPRINT_APK=${PWD}/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # The certificate lines read "Signer #1 certificate ..." or "Signer (minSdkVersion=…) ..."
          # depending on the build-tools version: match the end of the line only.
          digest() { "$BT/apksigner" verify --print-certs "$1" | awk '/certificate SHA-256 digest/ { print $NF; exit }'; }
          for APK in "$FLOURPRINT_APK_FROM" apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk; do
            echo "== $APK"
            sha256sum "$APK"
            "$BT/aapt" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-debuggable)"
            "$BT/apksigner" verify --verbose --print-certs "$APK"
          done
          FROM=$(digest "$FLOURPRINT_APK_FROM")
          TO=$(digest apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk)
          echo "Signer SHA-256: 0.1.0 ${FROM}; candidate ${TO}"
          test -n "$FROM" && test "$FROM" = "$TO"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: pnpm --filter @flourprint/mobile e2e:android-upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flourprint-android-upgrade-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          if-no-files-found: ignore
