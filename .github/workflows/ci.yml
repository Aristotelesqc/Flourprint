name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vitest run
      - run: node apps/cli/dist/main.js --version
      - run: pnpm build:mobile
      - run: scripts/check-mobile-bundle.sh

  android:
    # Debug APK for the device spikes (#23, #24); download it from the run's artifacts.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Build identifiers
        # On a pull request GITHUB_SHA is GitHub's temporary merge commit; label the branch commit.
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "FLOURPRINT_BUILD=${GITHUB_RUN_NUMBER}-${HEAD_SHA::7}" >> "$GITHUB_ENV"
          echo "FLOURPRINT_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm build:mobile
      - run: pnpm --filter @flourprint/mobile exec cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - name: Name the APK after the build
        run: mv apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "flourprint-${FLOURPRINT_BUILD}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: flourprint-debug-apk
          path: flourprint-*.apk
          retention-days: 30
