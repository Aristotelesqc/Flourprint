name: Backlog view

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  label:
    types: [created, edited, deleted]
  workflow_dispatch:
  # Reconcile token-originated changes that do not emit another Actions run.
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: backlog-view-30
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Aristotelesqc/Flourprint'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/backlog-view.test.mjs
      - name: Refresh the generated comment on issue 30
        run: node scripts/backlog-view.mjs --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
