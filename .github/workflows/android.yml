name: Android

# Platform suite on an emulator (installed APK, native SQLite, forced stop, reinstall, back
# button). It does not run on every web change: only when platform code changes, or on demand.
on:
  pull_request:
    paths:
      - apps/mobile/android/**
      - apps/mobile/android-e2e/**
      - apps/mobile/capacitor.config.ts
      - apps/mobile/package.json
      - apps/mobile/playwright.android.config.ts
      - apps/mobile/src/services/services.tsx
      - packages/adapters/src/sql/**
      - packages/adapters/src/sqlite-capacitor/**
      - packages/adapters/src/testing/**
      - packages/adapters/package.json
      - apps/mobile/src/services/device-checks.ts
      - pnpm-lock.yaml
      - .github/workflows/android.yml
  workflow_dispatch:

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Build identifiers
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "FLOURPRINT_BUILD=${GITHUB_RUN_NUMBER}-${HEAD_SHA::7}" >> "$GITHUB_ENV"
          echo "FLOURPRINT_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm build:mobile
      - run: pnpm --filter @flourprint/mobile exec cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOURPRINT_APK: ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: pnpm --filter @flourprint/mobile e2e:android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flourprint-android-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          if-no-files-found: ignore
